<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국사2 1차 정기시험 대비</title>
<meta name="theme-color" content="#27457A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한국사2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root {
  --paper: #FCFCFA;
  --ink: #1C1F26;
  --pencil: #687080;
  --rule: #D5D8DE;
  --indigo: #27457A;
  --indigo-soft: #E8EDF6;
  --omr: #DC4F78;
  --omr-soft: #FBE8EE;
  --red: #D42A20;
  --pen: #2F5BD3;
  --hl: #FFF1A6;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --hand: "Nanum Pen Script", "Nanum Pen", cursive;
  --nav-h: 58px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17191E; --ink: #E6E8EC; --pencil: #9BA2AE; --rule: #343842;
    --indigo: #93B2EA; --indigo-soft: #1F2A3D; --omr: #F07B9D; --omr-soft: #3A2129;
    --red: #FF6B5E; --pen: #8EAAFF; --hl: #5A4E12;
  }
}
:root[data-theme="dark"] {
  --paper: #17191E; --ink: #E6E8EC; --pencil: #9BA2AE; --rule: #343842;
  --indigo: #93B2EA; --indigo-soft: #1F2A3D; --omr: #F07B9D; --omr-soft: #3A2129;
  --red: #FF6B5E; --pen: #8EAAFF; --hl: #5A4E12;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
#view { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 96px); }

/* ---------- 머리 (시험지 상단표) ---------- */
.sheet-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; margin-bottom: 18px; }
.head-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.head-tbl th, .head-tbl td { border: 1.5px solid var(--ink); padding: 6px 8px; vertical-align: middle; }
.head-tbl th { font-weight: 600; white-space: nowrap; background: var(--indigo-soft); width: 1%; }
.head-tbl td { font-family: var(--serif); }
.head-tbl .small { font-family: var(--sans); font-size: 12px; color: var(--pencil); margin-top: 2px; }
.sign { display: grid; grid-template-rows: repeat(3, 1fr); border: 1.5px solid var(--ink); min-width: 74px; }
.sign div { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 6px; border-top: 1px solid var(--ink); }
.sign div:first-child { border-top: 0; }
.sign span { font-size: 11px; color: var(--pencil); line-height: 1.2; }
.sign b { font-size: 16px; line-height: 1.3; font-variant-numeric: tabular-nums; }

/* ---------- 설정 (답안지 기입란) ---------- */
.form { border: 1.5px solid var(--ink); }
.row { display: grid; grid-template-columns: 76px 1fr; border-top: 1px solid var(--ink); }
.row:first-child { border-top: 0; }
.row.off { display: none; }
.lab { background: var(--indigo-soft); border-right: 1px solid var(--ink); padding: 12px 8px; font-weight: 600; font-size: 14px; text-align: center; }
.fld { padding: 10px 12px; }
.hint { color: var(--pencil); font-size: 13px; margin: 6px 0 0; }
.modes { display: grid; gap: 8px; }
.mode { text-align: left; background: transparent; border: 1px solid var(--rule); padding: 10px 12px; cursor: pointer; border-radius: 2px; }
.mode b { display: block; font-size: 15px; }
.mode span { font-size: 13px; color: var(--pencil); }
.mode[aria-pressed="true"] { border-color: var(--indigo); box-shadow: inset 4px 0 0 var(--indigo); background: var(--indigo-soft); }
.bubbles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.bub { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 6px 0; cursor: pointer; font-size: 15px; min-height: 36px; }
.oval { width: 15px; height: 22px; border: 1.5px solid var(--omr); border-radius: 50%; flex: none; transition: background .12s; }
.bub[aria-pressed="true"] .oval { background: var(--ink); border-color: var(--ink); }
.bub[aria-pressed="false"] { color: var(--pencil); }
.tog { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; cursor: pointer; }
.tog input { width: 18px; height: 18px; accent-color: var(--indigo); }
.startbar { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); margin-top: 16px; background: var(--paper); border: 1.5px solid var(--ink); padding: 10px 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.cnt { margin: 0; font-size: 14px; }
.cnt.warn { color: var(--red); }

/* ---------- 버튼 ---------- */
.btn { border: 1.5px solid var(--ink); background: var(--paper); padding: 10px 18px; font-weight: 600; cursor: pointer; border-radius: 2px; min-height: 44px; }
.btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #10131A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10131A; } }
.btn:active { transform: translateY(1px); }
.txtbtn { background: none; border: 0; color: var(--pencil); padding: 8px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- 문제 상단 ---------- */
.qtop { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.prog { flex: 1; height: 4px; background: var(--rule); }
.prog i { display: block; height: 100%; background: var(--indigo); transition: width .25s; }
.pc { font-size: 13px; color: var(--pencil); font-variant-numeric: tabular-nums; white-space: nowrap; }
.timer { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--pencil); }

/* ---------- 시험지 ---------- */
.paper { border: 1.5px solid var(--ink); padding: 16px; background: var(--paper); }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.st { font-size: 12px; border: 1px solid var(--rule); padding: 1px 7px; color: var(--pencil); line-height: 1.6; }
.st.plain { border-style: dashed; }
.st.lv1 { border-color: var(--indigo); color: var(--indigo); }
.st.lv2 { border-color: var(--omr); color: var(--omr); }
.st.lv3 { border-color: var(--red); color: #fff; background: var(--red); }
.st.link { border-color: var(--pen); color: var(--pen); }
.q .stem { font-family: var(--serif); font-size: 17px; line-height: 1.75; margin: 0 0 12px; font-weight: 500; }
.exam-q .stem { font-weight: 700; }
.qn { position: relative; font-weight: 700; margin-right: 2px; }
.pts { font-weight: 400; color: var(--pencil); font-size: 15px; }
.desc { display: block; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--ink); font-weight: 400; }
.blank { color: var(--pencil); letter-spacing: 1px; }
.box { border: 1px solid var(--ink); padding: 12px 14px; margin: 0 0 12px; font-family: var(--serif); font-size: 15.5px; line-height: 1.85; }
.box small { font-family: var(--sans); color: var(--pencil); font-size: 12px; }
.box .cite { text-align: right; font-family: var(--sans); font-size: 13px; color: var(--pencil); margin-top: 6px; }
.box.dialog p { margin: 4px 0; }
.box.dialog b { display: inline-block; min-width: 3.4em; font-family: var(--sans); font-size: 14px; }
.box.note { border-style: dashed; font-family: var(--sans); }
.box.card { border-width: 2px; border-radius: 6px; font-family: var(--sans); }
.tblwrap { overflow-x: auto; }
.cmp { border-collapse: collapse; width: 100%; font-size: 14px; font-family: var(--sans); min-width: 480px; }
.cmp th, .cmp td { border: 1px solid var(--ink); padding: 6px 8px; text-align: left; vertical-align: top; }
.cmp thead th { background: var(--indigo-soft); text-align: center; }
.bogi { position: relative; border: 1px solid var(--ink); padding: 18px 14px 10px; margin: 18px 0 12px; font-family: var(--serif); font-size: 15.5px; }
.bogi p { margin: 4px 0; padding-left: 1.6em; text-indent: -1.6em; }
.bogi-tab { position: absolute; top: -12px; left: 12px; background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 1px 12px; letter-spacing: 2px; }
.tl { overflow-x: auto; margin: 0 0 12px; padding-bottom: 4px; }
.tl-bar { display: flex; align-items: flex-start; min-width: 560px; border-top: 0; }
.tl .mark { flex: none; width: 84px; text-align: center; font-size: 12.5px; line-height: 1.35; }
.tl .mark i { display: block; width: 1.5px; height: 14px; background: var(--ink); margin: 0 auto 4px; }
.tl .seg { flex: 1; text-align: center; border-top: 1.5px solid var(--ink); background: var(--indigo-soft); font-weight: 700; font-size: 14px; padding: 2px 0; margin-top: 6px; }
.tl .mark em { font-style: normal; display: block; }

/* 선지 */
.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ch { position: relative; width: 100%; display: flex; gap: 8px; align-items: flex-start; text-align: left; background: transparent; border: 1px solid transparent; padding: 8px 8px; cursor: pointer; font-family: var(--serif); font-size: 16px; line-height: 1.65; min-height: 44px; }
.ch:hover:not(:disabled) { border-color: var(--rule); }
.ch:disabled { cursor: default; }
.cn { flex: none; width: 1.3em; position: relative; }
.ch.marked { border-color: var(--omr); background: var(--omr-soft); }
.ch.marked .cn { color: var(--omr); font-weight: 700; }
.ch.right .ct { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.ch.picked .ct { color: var(--pencil); }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.oxb { position: relative; font-family: var(--serif); font-size: 34px; font-weight: 700; padding: 16px; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; min-height: 84px; }
.oxb.picked { color: var(--pencil); }
.typed { display: flex; gap: 8px; align-items: stretch; }
.typed input { flex: 1; min-width: 0; font: inherit; font-family: var(--serif); font-size: 18px; padding: 8px 4px; border: 0; border-bottom: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 0; }
.typed input:focus { outline: none; border-bottom-color: var(--indigo); }
.typed.ok input { border-bottom-color: var(--indigo); }
.typed.no input { text-decoration: line-through; text-decoration-color: var(--red); color: var(--pencil); }

/* ---------- 빨간 펜 ---------- */
.pen { position: absolute; pointer-events: none; overflow: visible; }
.pen path { fill: none; stroke: var(--red); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw .5s cubic-bezier(.3, .7, .4, 1) forwards; }
.ch .pen-o { left: -6px; top: 50%; width: 38px; height: 38px; transform: translateY(-50%) rotate(-8deg); }
.ch .pen-x { left: -2px; top: 50%; width: 30px; height: 30px; transform: translateY(-50%); }
.oxb .pen { left: 50%; top: 50%; width: 76px; height: 76px; transform: translate(-50%, -50%); }
.qmark.pen-o { left: -16px; top: -14px; width: 52px; height: 52px; transform: rotate(-10deg); }
.qmark.pen-x { left: -8px; top: -10px; width: 40px; height: 40px; }
.qmark path { stroke-width: 4; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .pen path { animation: none; stroke-dashoffset: 0; } }

/* ---------- 채점 결과 ---------- */
#fb:empty { display: none; }
#fb { margin-top: 14px; border-top: 1px dashed var(--rule); padding-top: 12px; }
.verdict { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hand { font-family: var(--hand); font-size: 34px; line-height: 1; color: var(--red); }
.verdict.ok .hand { color: var(--indigo); }
.ansline { font-weight: 600; }
.full { font-family: var(--serif); margin: 10px 0 0; }
mark.ans { background: var(--hl); color: inherit; padding: 0 2px; font-weight: 700; }
.exp { margin: 8px 0 0; font-size: 14.5px; color: var(--ink); background: var(--hl); padding: 6px 10px; }
.why { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14.5px; }
.why li { padding: 5px 0; border-bottom: 1px dotted var(--rule); }
.why li b { display: inline-block; min-width: 1.6em; }
.why li.is-ans { color: var(--red); }
.linknote { font-size: 14px; color: var(--pen); margin: 12px 0 0; }
.next { margin-top: 14px; width: 100%; }

/* 실전 시험지 */
.exam-paper { padding-top: 6px; }
.eq { padding: 18px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 16px; }
.eq:last-child { border-bottom: 0; }
.efb details { margin-top: 8px; font-size: 14.5px; }
.efb summary { cursor: pointer; color: var(--red); font-weight: 600; padding: 6px 0; }
.omr { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); margin-top: 12px; background: var(--paper); border: 1.5px solid var(--omr); padding: 10px; }
.omr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; margin-bottom: 8px; max-height: 92px; overflow-y: auto; }
.omr-c { display: flex; flex-direction: column; align-items: center; border: 0; background: none; cursor: pointer; padding: 2px 0; font-size: 11px; color: var(--omr); }
.omr-c i { display: grid; place-items: center; width: 16px; height: 22px; border: 1.5px solid var(--omr); border-radius: 50%; font-style: normal; font-size: 11px; color: transparent; }
.omr-c.filled i { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.omr-c.c-ok span { color: var(--indigo); font-weight: 700; }
.omr-c.c-no span { color: var(--red); font-weight: 700; text-decoration: line-through; }
.omr .btn { width: 100%; }
.omr .btnrow { margin-top: 0; }
.omr .btnrow .btn { flex: 1; width: auto; }
.score-tbl { width: 100%; border-collapse: collapse; margin: 6px 0 10px; text-align: center; }
.score-tbl th, .score-tbl td { border: 1.5px solid var(--ink); padding: 6px; }
.score-tbl th { background: var(--indigo-soft); font-size: 13px; }
.score-tbl .big { font-family: var(--hand); font-size: 36px; color: var(--red); line-height: 1.1; }
.score-tbl .big small { font-family: var(--sans); font-size: 13px; color: var(--pencil); }
.sub { color: var(--pencil); font-size: 14px; margin: 6px 0; }
.sub a { color: var(--red); }
.result h3.sec, h3.sec { font-size: 15px; margin: 18px 0 6px; border-bottom: 1.5px solid var(--ink); padding-bottom: 4px; }
.wlist { padding-left: 1.4em; margin: 0; }
.wlist li { padding: 8px 0; border-bottom: 1px dotted var(--rule); }
.wlist p { margin: 0; font-family: var(--serif); }
.wa { color: var(--red); font-size: 14px; font-family: var(--sans); }
.mine { color: var(--pencil); margin-left: 6px; }
.wq { font-family: var(--serif); }
.wm { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.cnt-x { font-size: 12px; color: var(--red); }
.empty { text-align: center; padding: 40px 0; }

/* ---------- 암기 노트 ---------- */
.notes-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.notes-head h2 { font-family: var(--serif); margin: 0; font-size: 22px; }
.sheet-btn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.jump { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 12px 0 8px; font-size: 13px; }
.jump a { color: var(--indigo); }
.notes { position: relative; }
.nsec { border: 1.5px solid var(--ink); padding: 12px 14px; margin-top: 12px; scroll-margin-top: 12px; }
.nsec h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 17px; }
.star { color: var(--pen); font-family: var(--hand); font-size: 22px; }
.nsec ul { margin: 0; padding-left: 1.1em; }
.nsec li { margin: 5px 0; line-height: 1.75; }
.key { color: var(--red); font-weight: 600; border-radius: 2px; transition: color .2s, background .2s; }
.pen-tag { font-family: var(--hand); color: var(--pen); font-size: 19px; margin-right: 6px; line-height: 1; }
.mini { font-size: 11px; border: 1px solid var(--rule); color: var(--pencil); padding: 0 5px; margin-right: 4px; vertical-align: 1px; white-space: nowrap; }
.tl-tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tl-tbl th { width: 4.2em; text-align: left; padding: 5px 8px 5px 0; vertical-align: top; font-variant-numeric: tabular-nums; }
.tl-tbl td { padding: 5px 0; border-bottom: 1px dotted var(--rule); }
.pairs { display: grid; gap: 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); }
.pair > div { padding: 8px 10px; font-size: 14px; }
.pair > div + div { border-left: 1px solid var(--rule); }
.pair b { display: block; font-family: var(--serif); }
.redsheet { position: absolute; inset: 0; pointer-events: none; background: #E53A2C; mix-blend-mode: multiply; opacity: 0; transform: translateX(-102%); transition: transform .45s cubic-bezier(.3, .7, .3, 1), opacity .2s; }
.sheet-on .redsheet { opacity: .55; transform: none; }
.sheet-on .key { color: transparent; background: rgba(212, 42, 32, .14); cursor: pointer; }
.sheet-on .key.peek { color: var(--ink); background: var(--hl); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .redsheet { mix-blend-mode: normal; background: #FF3B2E; } :root:not([data-theme="light"]) .sheet-on .redsheet { opacity: .12; } }
@media (prefers-reduced-motion: reduce) { .redsheet { transition: none; } }

/* ---------- 아래 탭 ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 1.5px solid var(--ink); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { height: var(--nav-h); border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--pencil); font-weight: 600; }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--indigo); }

@media (max-width: 420px) {
  #view { padding-left: 12px; padding-right: 12px; }
  .row { grid-template-columns: 62px 1fr; }
  .lab { font-size: 13px; padding: 12px 4px; }
  .q .stem { font-size: 16.5px; }
  .paper { padding: 12px; }
}

/* ---------- 전체 범위 추가 ---------- */
.unitbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.unit { border: 1px solid var(--indigo); background: transparent; color: var(--indigo); font-size: 13px; padding: 4px 10px; border-radius: 2px; cursor: pointer; min-height: 32px; }
.unit:active { background: var(--indigo-soft); }
.bubbles .bub[data-g="topics"] { font-size: 14px; min-width: 9.5em; }
.tpick { display: flex; gap: 4px; overflow-x: auto; margin: 12px 0 6px; padding-bottom: 4px; }
.tp { flex: none; border: 1.5px solid var(--ink); background: var(--paper); font-weight: 600; font-size: 13px; padding: 4px 9px; cursor: pointer; border-radius: 2px; min-height: 34px; }
.tp[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.ntitle { font-family: var(--serif); font-size: 18px; margin: 10px 0 0; }
.ntitle span { display: block; font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--pencil); }
.mini.lvm2 { border-color: var(--omr); color: var(--omr); }
.mini.lvm3 { border-color: var(--red); background: var(--red); color: #fff; }
.head-tbl td:last-child { white-space: nowrap; }
.bubbles:has(.bub[data-g="topics"]) { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5em, 1fr)); gap: 0 10px; }
</style>
</head>
<body>
<main id="view"></main>
<nav class="nav" aria-label="화면 이동">
  <button data-tab="home" aria-current="page">문제</button>
  <button data-tab="notes">노트</button>
  <button data-tab="wrong">오답</button>
</nav>
<script>/* =====================================================================
   데이터 영역 — 새 주제·선생님 자료를 추가할 때는 이 파일(섹션)만 고치면 돼요.

  { id: 's06', t: 't02', lv: 3, title: '조선 민족 운동에 대한 대책', d: '1920', y: 1920, c: '1920', text: '핵심적 친일 인물을 골라 그 인물로 하여금 귀족, 양반, 유생, 부호, 교육가, 종교가에 침투하여 각종 친일 단체를 조직하게 한다.', f: ['친일 세력을 키워 민족을 분열시키려는 일제의 방침을 담고 있다.'] },
  { id: 's07', t: 't03', lv: 1, title: '국가 총동원법', d: '1938', y: 1938, c: '『조선 법령 집람』, 1938', text: '제1조 국가 총동원이란 전시에 국방 목적을 달성하기 위해 국가의 전력을 가장 유효하게 발휘하도록 인적 및 물적 자원을 운용하는 것을 말한다.', f: ['중일 전쟁 이후 인력과 물자를 수탈하는 근거가 되었다.'] },

  { id: 's10', t: 't04', lv: 1, title: '토지 조사령', d: '1912. 8.', y: 1912, c: '『조선 총독부 관보』, 1912', text: '제4조 토지 소유자는 조선 총독이 정하는 기간 내에 주소, 성명 또는 명칭 및 소유지의 소재, 지목, 자번호, 사표, 등급, 지적, 결수를 임시 토지 조사국장에게 신고해야 한다.', f: ['정해진 기간 안에 신고해야 토지 소유권을 인정받게 하였다.'] },

  { id: 's13', t: 't05', lv: 2, title: '쌀 이출을 다룬 동아일보 기사', d: '1927. 4.', y: 1927, c: '동아일보, 1927. 4. 8.', text: '대개 조선인들이 생산한 쌀을 수출하거나 이출할 때 결코 자신들이 충분히 소비하고 남은 것을 수출하는 것이 아니다. 생계가 곤란하여 먹을 것을 먹지 못하고 파는 것이다.', f: ['산미 증식 계획 시기에 쌀 이출이 늘어난 상황을 다루었다.'] },
  { id: 's14', t: 't06', lv: 2, title: '공출을 독려하는 포스터', d: '1940년대', y: null, c: '조선 총독부', text: '‘한 알의 쌀이라도 더 많이 나라에 바쳐서 짐승 같은 미·영을 때려 부수자!’ ‘공출 때는 지주님도 한몫 해 주시니 고마워.’', f: ['농가마다 목표량을 정해 쌀을 강제로 걷던 시기에 만들어졌다.'] },
  { id: 's15', t: 't08', lv: 1, title: '2·8 독립 선언서', d: '1919. 2.', y: 1919, c: '1919', text: '조선 청년 독립단은 아(我) 2천만 민족을 대표하여 정의와 자유의 승리를 얻은 세계 만국 앞에 독립을 달성하기를 선언하노라. …… 우리 민족은 생존을 위하여 자유의 행동을 취하여 독립을 기하기를 선언하노라.', f: ['도쿄의 한국인 유학생들이 발표하였다.'] },
  { id: 's16', t: 't08', lv: 1, title: '3·1 독립 선언서', d: '1919. 3.', y: 1919, c: '보성사판', text: '오등은 자에 아(我) 조선의 독립국임과 조선인의 자주민임을 선언하노라. 이로써 세계 만방에 고하여 인류 평등의 대의를 극명하며 ……', f: ['민족 대표 33인의 이름으로 발표되었다.'] },
  { id: 's17', t: 't09', lv: 2, title: '대한민국 임시 정부 성립 축하문', d: '1919. 11.', y: 1919, c: '독립신문, 1919. 11. 15.', text: '10년의 노예 생활을 벗어나 금일에 다시 독립 대한의 국민이 되었도다. …… 다시 부패한 전제 정부의 노예도 아니요, 독립한 민주국의 자유민이라.', f: ['삼권 분립에 기초한 민주 공화제 정부의 수립을 축하하였다.'] },
  { id: 's18', t: 't09', lv: 2, title: '국민 대표 회의 선언문', d: '1923. 1.', y: 1923, c: '1923', text: '본 국민 대표 회의는 이천만 민중의 공정한 뜻에 바탕을 둔 국민적 대회합으로 최고의 권위를 지녀 …… 통일적 기관 아래서 대업을 완성하고자 하노라.', f: ['창조파와 개조파 등의 대립으로 결렬되었다.'] },
  { id: 's19', t: 't09', lv: 3, title: '이승만의 위임 통치 청원서', d: '1919', y: 1919, c: '『한국 독립운동사 자료집』', text: '우리는 자유를 사랑하는 2천만의 이름으로 각하에게 청원합니다. …… 장래 완전한 독립을 보증하고 당분간은 한국을 국제 연맹 통치 밑에 두게 할 것을 바랍니다.', f: ['이 청원은 훗날 이승만이 임시 정부 대통령에서 탄핵되는 배경이 되었다.'] },
  { id: 's20', t: 't10', lv: 1, title: '조선 혁명 선언', d: '1923', y: 1923, c: '1923', text: '민중은 우리 혁명의 대본영이다. 폭력은 우리 혁명의 유일한 무기이다. 우리는 민중 속으로 가서 민중과 손을 맞잡고 끊임없는 폭력, 암살, 파괴, 폭동으로써 강도 일본의 통치를 타도하고 ……', f: ['신채호가 작성하였고 의열단의 활동 지침이 되었다.'] },
  { id: 's21', t: 't10', lv: 2, title: '김상옥 의거를 보도한 기사', d: '1923. 3.', y: 1923, c: '동아일보, 1923. 3. 15.', text: '1월 12일 저녁에 종로 경찰서에 폭발탄이 터진 이후 …… 일본 수백 명 경관은 왕십리 일대와 광희정 일대를 수색하며 기마 순사가 총검을 번쩍이며 ……', f: ['의열단원의 의거를 다루었다.'] },
  { id: 's22', t: 't11', lv: 1, title: '물산 장려 운동 취지서', d: '1923. 12.', y: 1923, c: '『산업계』, 1923. 12.', text: '조선 사람은 조선 사람이 지은 것을 사서 쓰고, 조선 사람은 단결하여 그가 쓰는 물건을 스스로 제작하여 공급하기를 목적하노라.', f: ['조만식 등이 평양에서 시작한 운동과 관련 있다.'] },
  { id: 's23', t: 't11', lv: 1, title: '조선 민립 대학 기성회 발기 취지서', d: '1923. 3.', y: 1923, c: '동아일보, 1923. 3. 30.', text: '우리의 운명을 어떻게 개척할까? …… 심오한 지식과 학문은 고등 교육이 아니면 불가하며, …… 대학의 설립이 아니고는 다른 방도가 없다.', f: ['1천만 원을 목표로 전국적인 모금 운동을 벌였다.'] },
  { id: 's24', t: 't11', lv: 2, title: '문자 보급 운동을 다룬 조선일보 기사', d: '1934. 6.', y: 1934, c: '조선일보, 1934. 6. 10.', text: '전 인구의 1,000분의 20밖에 문자를 이해하지 못하고, 취학 연령 아동의 10분의 3밖에 학교에 갈 수 없는 조선의 현실에서 간단하고 쉬운 문자의 보급은 …… 가장 시급한 일이라 하겠다.', f: ['‘아는 것이 힘, 배워야 산다’를 표어로 내건 운동과 관련 있다.'] },
  { id: 's25', t: 't11', lv: 1, title: '이광수, 「민족적 경륜」', d: '1924. 1.', y: 1924, c: '동아일보, 1924. 1. 3.', text: '지금까지 해 온 정치적 운동은 모두 일본을 적대시하는 운동뿐이었다. …… 조선 내에서 허용되는 범위 내에서 일대 정치적 결사를 조직해야 한다는 것이 우리의 주장이다.', f: ['일제가 허용하는 범위 안의 자치를 주장하여 비판을 받았다.'] },
  { id: 's26', t: 't12', lv: 2, title: '조선 민흥회의 제안', d: '1926. 7.', y: 1926, c: '시대일보, 1926. 7. 11.', text: '조선 민흥회는 조선 민족의 공동 권익을 쟁취하고, 조선민의 단일 전선을 결성할 목적으로 창설되었습니다.', f: ['비타협적 민족주의 세력이 일부 사회주의 세력과 함께 만든 단체의 주장이다.'] },
  { id: 's27', t: 't12', lv: 2, title: '정우회 선언', d: '1926. 11.', y: 1926, c: '조선일보, 1926. 11. 17.', text: '민족주의적 세력에 대해서는 …… 우리와 과정적 동맹을 맺을 수 있음을 충분히 인정하여, 적극적으로 제휴해야 할 것입니다.', f: ['사회주의 계열이 민족주의 세력과의 연대를 주장하였다.'] },
  { id: 's28', t: 't12', lv: 1, title: '신간회 강령', d: '1927. 1.', y: 1927, c: '동아일보, 1927. 1. 20.', text: '1. 우리는 정치·경제적 각성을 촉진함. 2. 우리는 단결을 공고히 함. 3. 우리는 기회주의를 일체 부인함.', f: ['광주 학생 항일 운동 때 진상 조사단을 보낸 단체의 강령이다.'] },
  { id: 's29', t: 't12', lv: 3, title: '코민테른의 12월 테제', d: '1928. 12.', y: 1928, c: '1928', text: '민족 혁명 운동에 계급성을 부여하고 그것을 타협적 개량주의로부터 분리시킴으로써 …… 프롤레타리아 혁명 운동을 강화하여야 한다.', f: ['일부 사회주의자들이 신간회 해소를 주장하는 배경이 되었다.'] },
  { id: 's30', t: 't13', lv: 2, title: '토막민 문제를 다룬 동아일보 기사', d: '1931. 11.', y: 1931, c: '동아일보, 1931. 11. 22.', text: '경성부의 발표에 의하면 경성부 내의 토막민 수가 1,583호이고 인구가 5,000여 명에 달한다고 한다. …… 1928년의 통계보다 거의 200호가 증가하였다.', f: ['도시 변두리에 움막을 짓고 살던 도시 빈민을 다루었다.'] },
  { id: 's31', t: 't13', lv: 2, title: '소작료 문제를 다룬 동아일보 기사', d: '1932. 4.', y: 1932, c: '동아일보, 1932. 4. 29.', text: '소작료는 각 지방마다 다르지만 …… 보통은 5할이 평균이다. 그러나 전라북도 남원 등에서는 소작료를 올려서 요즘에는 7할 또는 8할에 이르게 되었다.', f: ['지역에 따라 수확량의 7~8할을 소작료로 낸 현실을 다루었다.'] },
  { id: 's32', t: 't17', lv: 2, title: '한국 독립군과 중국군의 합의', d: '1931', y: 1931, c: '한국광복군 사령부, 『광복』', text: '한중 양군은 최악의 상황이 오는 경우에도 장기간 항전할 것을 맹세한다. …… 중동 철도를 경계선으로 서부 전선은 중국이 맡고, 동부 전선은 한국이 맡는다.', f: ['지청천이 이끈 부대가 북만주에서 중국 호로군과 연합하였다.'] },
  { id: 's33', t: 't17', lv: 2, title: '조선 혁명군과 중국군의 합의', d: '1932', y: 1932, c: '한국광복군 사령부, 『광복』', text: '중국과 한국 양국의 군민은 한마음 한뜻으로 일제에 대항하여 싸우고, 인력과 물자는 서로 나누어 쓰며, 합작의 원칙 아래 국적과 관계없이 그 능력에 따라 항일 공작을 나누어 맡는다.', f: ['양세봉이 이끈 부대가 남만주에서 중국 의용군과 연합하였다.'] },
  { id: 's34', t: 't18', lv: 1, title: '이봉창의 한인 애국단 선서문', d: '1931. 12.', y: 1931, c: '대한민국 13년 12월', text: '나는 적성으로써 조국의 독립과 자유를 회복하기 위하여 한인 애국단의 일원이 되어 적국의 수괴를 도륙하기로 맹세하나이다.', f: ['김구가 상하이에서 조직한 단체에 들어가며 쓴 것이다.'] },
  { id: 's35', t: 't19', lv: 2, title: '한국광복군 선언문', d: '1940', y: 1940, c: '『대한민국 임시 정부 자료집』', text: '대한민국 임시 정부는 …… 중화민국 영토 내에서 광복군을 조직하고 …… 공동의 적인 일본 제국주의자들을 타도하고자 연합군의 일원으로 항전을 계속한다.', f: ['충칭에서 창설된 임시 정부 군대의 선언이다.'] },
  { id: 's36', t: 't19', lv: 2, title: '대한민국 임시 정부 대일 선전 성명서', d: '1941. 12.', y: 1941, c: '1941', text: '우리는 3천만 한국인과 정부를 대표하여 …… 한국 전체 인민은 현재 이미 반침략 전선에 참가하였으니, 한 개의 전투 단위로서 추축국에 선전한다.', f: ['아시아·태평양 전쟁이 일어난 직후 발표되었다.'] },
  { id: 's37', t: 't19', lv: 1, title: '대한민국 건국 강령', d: '1941. 11.', y: 1941, c: '『대한민국 임시 정부 자료집』', text: '삼균 제도를 골자로 한 헌법을 실시하여 정치·경제·교육의 민주적 시설로 실제상 균형을 도모하며, 전국의 토지와 대생산 기관의 국유가 완성되고 ……', f: ['조소앙의 삼균주의를 바탕으로 하였다.'] },
  { id: 's38', t: 't19', lv: 2, title: '조선 독립 동맹의 건국 강령', d: '1942. 8.', y: 1942, c: '해방일보, 1942. 8. 29.', text: '본 동맹은 일본 제국주의의 조선 통치를 전복하고, 독립 자유의 조선 민주 공화국 건립을 목적으로 하여 아래의 제 임무를 규정한다. 1. 전 국민의 보통 선거에 의한 민주 정권을 수립한다.', f: ['김두봉을 주석으로 하고 조선 의용군을 두었다.'] },
  { id: 's39', t: 't19', lv: 2, title: '조선 건국 동맹의 건국 강령', d: '1944', y: 1944, c: '『여운형 투쟁사』', text: '1. 각인 각파를 대동단결하여 거국일치로 일본 제국주의의 모든 세력을 몰아내고 조선 민족의 자유와 독립을 회복할 것', f: ['여운형이 국내에서 비밀리에 조직한 단체의 강령이다.'] },
  { id: 's40', t: 't19', lv: 1, title: '카이로 선언', d: '1943. 11.', y: 1943, c: '1943', text: '3대국은 한국 인민의 노예 상태에 유의하여 적당한 시기에 한국이 자유롭고 독립하게 될 것을 결의한다.', f: ['미국·영국·중국 대표가 처음으로 한국 독립을 약속하였다.'] },
  { id: 's41', t: 'u01', lv: 1, title: '모스크바 3국 외상 회의 결정', d: '1945. 12.', y: 1945, c: '동아일보, 1945. 12. 30.', text: '조선 임시 정부 수립을 원조하기 위하여 …… 남조선 미군 사령부 대표들과 북조선 소련군 사령부 대표들로 공동 위원회를 조직한다. …… 5년 이내를 기한으로 하는 조선에 대한 4개국 신탁 통치 협약을 작성한다.', f: ['미소 공동 위원회를 설치하기로 결정하였다.'] },
  { id: 's42', t: 'u01', lv: 2, title: '신탁 통치 반대 국민 대회 선언문', d: '1946. 1.', y: 1946, c: '중앙신문, 1946. 1. 1.', text: '카이로, 포츠담 선언과 국제 헌장으로 세계에 공약한 한국의 독립 부여는 금번 모스크바 3상 회의의 신탁 관리 결의로 수포로 돌아갔다. …… 3천만의 총역량을 발휘하여 신탁 관리제를 배격하는 국민운동을 전개한다.', f: ['우익 세력이 신탁 통치 결정에 반대하며 발표하였다.'] },
  { id: 's43', t: 'u01', lv: 2, title: '모스크바 3국 외상 회의 결정 지지 담화문', d: '1946. 1.', y: 1946, c: '중앙신문, 1946. 1. 3.', text: '카이로 선언이 조선 독립을 ‘적당한 시기’에 준다는 것인데 이번 회담에서 5년 이내로 규정된 것이다. …… 하루속히 민주주의 원칙을 내세우고 조선 민족 통일 전선을 완성하는 데 힘을 모아야 한다.', f: ['좌익 세력이 입장을 바꾸어 회의 결정을 지지하였다.'] },
  { id: 's44', t: 'u02', lv: 1, title: '이승만의 정읍 발언', d: '1946. 6.', y: 1946, c: '서울신문, 1946. 6. 5.', text: '무기 휴회된 공위가 재개될 기색도 보이지 않으며 통일 정부를 고대하나 여의케 되지 않으니 우리는 남방만이라도 임시 정부 혹은 위원회 같은 것을 조직하여 ……', f: ['남한만이라도 정부를 세우자는 주장으로, 좌우 합작 운동의 배경이 되었다.'] },
  { id: 's45', t: 'u02', lv: 2, title: '좌우 합작 7원칙', d: '1946. 10.', y: 1946, c: '동아일보, 1946. 10. 8.', text: '1. 모스크바 3국 외상 회의의 결정에 따라 남북의 좌우 합작으로 민주주의 임시 정부를 수립할 것 …… 3. 토지는 몰수, 유조건 몰수, 체감 매상 등으로 농민에게 무상으로 분여할 것', f: ['여운형과 김규식 등 중도 세력이 주도하였다.'] },
  { id: 's46', t: 'u02', lv: 1, title: '김구, 「삼천만 동포에게 읍고함」', d: '1948. 2.', y: 1948, c: '경향신문, 1948. 2. 11.', text: '한국이 있어야 한국 사람이 있고, 한국 사람이 있고야 민주주의도, 공산주의도, 무슨 단체도 존재할 수 있는 것이다. …… 나는 통일된 조국을 건설하려다가 38도선을 베고 쓰러질지언정 ……', f: ['남한만의 단독 정부 수립에 반대하며 발표되었다.'] },

function genAutoExams(n) {
  const tids = S.set.topics; const out = []; const used = new Set(); let guard = 0;
  const ok2 = S.set.lv.includes(2), ok3 = S.set.lv.includes(3);
  if (!ok2 && !ok3) return out;
  while (out.length < n && guard++ < n * 30) {
    const tid = tids[Math.floor(Math.random() * tids.length)]; const r = Math.random(); let q = null;
    if (r < 0.5) q = ok2 ? genTF(tid) : null;
    else if (r < 0.75) q = ok2 ? genSrcFact(tid) : null;
    else if (r < 0.88) q = ok3 ? genNoteOrder(tids) : null;
    else q = ok3 ? genSrcOrder(tids) : null;
    if (!q || used.has(q.grp)) continue;
    used.add(q.grp); out.push(q); AUTO_BY[q.id] = q;
  }
  return out;
}
function examSet(n) {
  const hand = examPool(); const useAuto = S.set.src.includes('auto');
  if (n === 0) return S.set.wrongFirst ? ordered(hand) : pickSpaced(hand, hand.length);
  const nHand = useAuto ? Math.min(hand.length, Math.ceil(n * 0.6)) : Math.min(hand.length, n);
  let pick = S.set.wrongFirst ? ordered(hand).slice(0, nHand) : pickSpaced(hand, nHand);
  if (useAuto && pick.length < n) pick = pick.concat(genAutoExams(n - pick.length));
  if (pick.length < n) { const rest = hand.filter(x => !pick.includes(x)); pick = pick.concat(pickSpaced(rest, n - pick.length)); }
  return pick;
}
const BANK_BY = Object.fromEntries(BANK.map(b => [b.id, b]));
const EXAM_BY = Object.fromEntries(EXAM.map(e => [e.id, { ...e, k: 'exam' }]));
const byId = id => BANK_BY[id] || EXAM_BY[id] || AUTO_BY[id];

/* 매번 새로 만드는 출제 형태 (보기 섞기 등) */
function instantiate(item, ansMode) {
  const it = { ...item, uid: Math.random().toString(36).slice(2) };
  if (it.k === 'exam') { it.opts = it.ch; it.correct = it.ans; it.choice = true; return it; }
  if (it.k === 'src') {
    const s = it.s; const pool = SOURCES.filter(x => x.title !== s.title);
    const d = []; for (const x of [...shuffle(pool.filter(x => Math.abs(tIdx(x.t) - tIdx(s.t)) <= 1)), ...shuffle(pool)]) if (d.length < 3 && !d.includes(x.title)) d.push(x.title);
    const opts = shuffle([s.title, ...d]); it.opts = opts; it.correct = opts.indexOf(s.title); it.choice = true; return it;
  }
  if (it.k === 'ox') { it.choice = true; it.ox = true; it.opts = ['O', 'X']; it.correct = it.a ? 0 : 1; return it; }
  if (it.k === 'mc4') {
    const idx = shuffle([0, 1, 2, 3]); it.opts = idx.map(i => it.o[i]); it.correct = idx.indexOf(it.a); it.choice = true; return it;
  }
  if (it.rev) {
    it.choice = true;
    if (it.k === 'slogan') {
      it.prompt = `<b>${esc(it.m)}</b>의 구호로 옳은 것은?`;
      const others = shuffle(SLOGANS.filter(x => x.m !== it.m)).map(x => x.s);
      const seen = new Set(); const d = [];
      for (const s of others) { const mv = SLOGANS.find(x => x.s === s).m; if (!seen.has(mv) || d.length + (4 - seen.size) > 3) { d.push(s); seen.add(mv); } if (d.length === 3) break; }
      const opts = shuffle([it.s, ...d.slice(0, 3)]); it.opts = opts; it.correct = opts.indexOf(it.s);
    } else {
      const self = it.list.find(o => o.n === it.name);
      const right = shuffle(self.d)[0];
      const pool = descPool(it.list, it.name);
      const pref = shuffle(pool.filter(x => (self.trap || []).includes(x.n)));
      const used = new Set(); const d = [];
      for (const x of [...pref, ...shuffle(pool)]) { if (!used.has(x.n)) { d.push(x.d); used.add(x.n); } if (d.length === 3) break; }
      const opts = shuffle([right, ...d]); it.opts = opts; it.correct = opts.indexOf(right);
      it.prompt = `<b>${esc(it.name)}</b>에 대한 설명으로 옳은 것은?`;
    }
    return it;
  }
  /* 정방향: blank / org / person / year / slogan */
  if (ansMode === 'type') { it.choice = false; return it; }
  it.choice = true;
  let d;
  if (it.k === 'year') d = nearYears(+it.a);
  else if (it.k === 'slogan') d = fill3(it.a, [], Object.keys(MOVES));
  else if (it.w) d = shuffle(it.w).slice(0, 3);
  else if (it.sent) d = autoDistract(it);
  else d = fill3(it.a, it.trap || ORGS.concat(PEOPLE).find(o => o.n === it.a)?.trap, poolOf(it.pool || 'org'));
  const opts = shuffle([it.a, ...d]); it.opts = opts; it.correct = opts.indexOf(it.a);
  return it;
}

/* ---------- 채점 ---------- */
const norm = s => String(s).normalize('NFC').toLowerCase().replace(/[\s·.,'"‘’“”「」『』()\[\]!?~\-%]/g, '');
function judgeTyped(it, raw) {
  const v = norm(raw);
  if (!v) return { ok: false, empty: true };
  if (it.k === 'year') { const y = (raw.match(/\d{4}/) || [])[0]; return { ok: y === it.a }; }
  const accept = [it.a, ...(it.alt || [])];
  if (it.k === 'slogan') accept.push(...(MOVES[it.a] || []));
  if (accept.some(a => norm(a) === v)) return { ok: true };
  if ((it.near || []).some(a => norm(a) === v)) return { ok: it.lv === 1, near: true };
  return { ok: false };
}

function passCommon(x) { return S.set.lv.includes(x.lv) && S.set.src.includes(x.src) && S.set.topics.includes(x.t || 't11'); }
function recallPool() {
  return BANK.filter(b => passCommon(b) && S.set.kinds.includes(b.k) && !(S.set.ans === 'type' && (b.rev || b.k === 'src')));
}
function examPool() { return EXAM.filter(passCommon); }
function ordered(list) {
  if (!S.set.wrongFirst) return shuffle(list);
  const w = list.filter(x => S.wrong[x.id]).sort((a, b) => S.wrong[b.id] - S.wrong[a.id]);
  return [...w, ...shuffle(list.filter(x => !S.wrong[x.id]))];
}
function nCount(len) { return S.set.n === 0 ? len : Math.min(S.set.n, len); }

function start() {

}

  if (it.rev && it.k !== 'slogan') h += `<p class="full">${esc(it.name)}: ${esc(it.opts[it.correct])}</p>`;
  if (it.k === 'slogan' && !it.rev && it.memo) h += `<p class="full">${esc(it.memo)}</p>`;
  if (extra.near) h += `<p class="full">정식 명칭은 <b>${esc(it.a)}</b>${it.lv === 1 ? ' — 상 난이도라 정답으로 인정했어요.' : ' — 최상·극상에서는 정식 명칭까지 써야 해요.'}</p>`;
  if (it.exp) h += `<p class="exp">${esc(it.exp)}</p>`;
  return h;
}
function finish(ok, extra) {
  const it = P.cur;
  recordItem(it, ok);
  P.res.push({ id: it.id, ok, k: it.k, linked: !!P.list[P.i].linkFrom, typed: extra.typed });
  let ansText;
  if (it.choice) ansText = it.ox ? (it.correct === 0 ? 'O' : 'X') : `${CIRC[it.correct]} ${it.k === 'exam' ? '' : esc(it.opts[it.correct])}`;
  else ansText = esc(it.a);
  let next = '';
  if (P.mode === 'mix' && it.k === 'exam') {
    const links = linkedFor(it, !ok);
    links.forEach(l => P.used.add(l.id));
    P.list.splice(P.i + 1, 0, ...links.map(l => ({ ...l, linkFrom: it.id })));
    if (links.length) next = `<p class="linknote">이 문제와 이어진 암기 ${links.length}문제가 바로 나와요.</p>`;
  }
  $('#fb').innerHTML = `
    <div class="verdict ${ok ? 'ok' : 'no'}"><span class="hand">${ok ? '정답' : '오답'}</span>${ok ? '' : `<span class="ansline">정답 ${ansText}</span>`}</div>
    ${explainHTML(it, extra)}
    ${next}
    <button class="btn primary next" id="next">${P.i + 1 >= P.list.length ? '결과 보기' : '다음'}</button>`;
  $('#next').onclick = () => { P.i++; showItem(); };
  $('#next').focus({ preventScroll: true });
  $('#fb').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
function shortQ(id) {
  const b = byId(id); if (!b) return id;
  if (b.k === 'exam') return b.stem.replace(/<[^>]+>/g, '');
  if (b.rev) return b.k === 'slogan' ? `${b.m}의 구호` : `${b.name}에 대한 설명`;
  if (b.k === 'src') return '사료: ' + b.q.slice(0, 40) + ' …';
  if (b.k === 'blank' || b.sent) return b.q.replace(/【(.+?)】/, '(　　)');
  return b.q;
}
function answerOf(id) {
  const b = byId(id); if (!b) return '';
  if (b.k === 'exam') return `${CIRC[b.ans]} ${b.ch[b.ans]}`;
  if (b.k === 'ox') return b.a ? 'O' : 'X';
  if (b.k === 'mc4') return b.o[b.a];
  if (b.rev) return b.k === 'slogan' ? `'${b.s}'` : (b.list.find(o => o.n === b.name).d[0]);
  if (b.k === 'blank') return b.q.match(/【(.+?)】/)[1];
  return b.a;
}
function practiceResult() {
  const r = P.res; const ok = r.filter(x => x.ok).length;
  const ex = r.filter(x => x.k === 'exam'), lk = r.filter(x => x.k !== 'exam');
  const wrong = r.filter(x => !x.ok);
  view.innerHTML = `
    <article class="paper result">
      <table class="score-tbl"><tr><th>푼 문제</th><th>맞힘</th><th>정답률</th></tr>
      <tr><td>${r.length}</td><td>${ok}</td><td class="big">${r.length ? Math.round(ok / r.length * 100) : 0}%</td></tr></table>
      ${P.mode === 'mix' ? `<p class="sub">실전 ${ex.filter(x => x.ok).length}/${ex.length}, 연결 암기 ${lk.filter(x => x.ok).length}/${lk.length}</p>` : ''}
      ${wrong.length ? `<h3 class="sec">틀린 문제</h3><ol class="wlist">${wrong.map(w => `<li><p>${esc(shortQ(w.id))}</p><p class="wa">정답: ${esc(answerOf(w.id))}${w.typed ? ` <span class="mine">내 답: ${esc(w.typed)}</span>` : ''}</p></li>`).join('')}</ol>` : '<p class="sub">다 맞았어요. 난이도를 올리거나 출처를 바꿔 보세요.</p>'}
      <div class="btnrow">
        ${wrong.length ? '<button class="btn primary" id="again">틀린 것만 다시</button>' : ''}
        <button class="btn" id="home">처음으로</button>
      </div>
    </article>`;
  if (wrong.length) $('#again').onclick = () => startPractice(shuffle([...new Set(wrong.map(w => w.id))].map(byId)), 'review');
  $('#home').onclick = () => go('home');
}

/* =====================================================================
   실전 시험지 (OMR 한꺼번에 채점)
   ===================================================================== */
let X = null;
function startPaper(items) {
  X = { items: items.map(e => instantiate({ ...e, k: 'exam' })), marks: {}, t0: Date.now(), done: false };
  items.forEach(e => { S.seen[e.id] = (S.seen[e.id] || 0) + 1; }); save();
  const total = X.items.reduce((a, e) => a + e.pts, 0);
  view.innerHTML = `
    <div class="qtop"><button class="txtbtn" id="quit">그만하기</button><span class="pc">실전 ${X.items.length}문항, ${total.toFixed(1)}점 만점</span><span class="timer" id="timer">0:00</span></div>
    <article class="paper exam-paper" id="paper">
      ${X.items.map((it, n) => `<section class="eq" id="q${n}" data-n="${n}">${stamps(it)}${examBody(it, n + 1)}${choicesHTML(it)}<div class="efb"></div></section>`).join('')}
    </article>
    <div class="omr" id="omr">
      <div class="omr-grid">${X.items.map((_, n) => `<button class="omr-c" data-n="${n}"><span>${n + 1}</span><i></i></button>`).join('')}</div>
      <button class="btn primary" id="submit">제출하고 채점</button>
    </div>`;
  $('#quit').onclick = () => go('home');
  $$('.eq', view).forEach(sec => {
    const n = +sec.dataset.n;
    $$('.ch', sec).forEach(b => b.onclick = () => {
      if (X.done) return;
      X.marks[n] = +b.dataset.i;
      $$('.ch', sec).forEach(c => c.classList.toggle('marked', c === b));
      const c = $(`.omr-c[data-n="${n}"]`); c.classList.add('filled'); c.querySelector('i').textContent = X.marks[n] + 1;
    });
  });
  $$('.omr-c', view).forEach(c => c.onclick = () => $(`#q${c.dataset.n}`).scrollIntoView({ behavior: 'smooth', block: 'start' }));
  $('#submit').onclick = submitPaper;
  clearInterval(X.timer);
  X.timer = setInterval(() => { const s = Math.floor((Date.now() - X.t0) / 1000); const el = $('#timer'); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; else clearInterval(X.timer); }, 1000);
}
function submitPaper() {
  const blank = X.items.length - Object.keys(X.marks).length;
  if (blank && !X.confirm) { X.confirm = true; const b = $('#submit'); b.textContent = `안 고른 ${blank}문항 있음, 그래도 제출`; return; }
  X.done = true; clearInterval(X.timer);
  let got = 0, max = 0; const wrongN = [];
  X.items.forEach((it, n) => {
    max += it.pts; const ok = X.marks[n] === it.ans; if (ok) got += it.pts; else wrongN.push(n);
    recordItem(it, ok);
    const sec = $(`#q${n}`); const btns = $$('.ch', sec);
    btns.forEach(b => b.disabled = true);
    sec.querySelector('.qn').insertAdjacentHTML('afterend', ok ? PEN_O.replace('pen-o', 'pen-o qmark') : PEN_X.replace('pen-x', 'pen-x qmark'));
    btns[it.ans].classList.add('right');
    if (!ok && X.marks[n] != null) btns[X.marks[n]].classList.add('picked');
    $('.efb', sec).innerHTML = `<details ${ok ? '' : 'open'}><summary>${ok ? '해설 보기' : `정답 ${CIRC[it.ans]} 해설`}</summary>${explainHTML(it, {})}</details>`;
    const c = $(`.omr-c[data-n="${n}"]`); c.classList.add(ok ? 'c-ok' : 'c-no');
  });
  const s = Math.floor((Date.now() - X.t0) / 1000);
  $('#paper').insertAdjacentHTML('afterbegin', `
    <table class="score-tbl"><tr><th>구분</th><th>맞힌 문항</th><th>점수</th><th>걸린 시간</th></tr>
    <tr><th>선다형</th><td>${X.items.length - wrongN.length} / ${X.items.length}</td><td class="big">${got.toFixed(1)}<small> / ${max.toFixed(1)}</small></td><td>${Math.floor(s / 60)}분 ${s % 60}초</td></tr></table>
    ${wrongN.length ? `<p class="sub">틀린 문항: ${wrongN.map(n => `<a href="#q${n}">${n + 1}번</a>`).join(', ')}</p>` : '<p class="sub">만점이에요.</p>'}`);
  $('#omr').innerHTML = `<div class="omr-grid">${$('#omr .omr-grid').innerHTML}</div><div class="btnrow">${wrongN.length ? '<button class="btn primary" id="mixw">틀린 문항 왕복 복습</button>' : ''}<button class="btn" id="home">처음으로</button></div>`;
  $$('.omr-c', view).forEach(c => c.onclick = () => $(`#q${c.dataset.n}`).scrollIntoView({ behavior: 'smooth', block: 'start' }));
  if (wrongN.length) $('#mixw').onclick = () => startPractice(wrongN.map(n => ({ ...byId(X.items[n].id) })), 'mix');
  $('#home').onclick = () => go('home');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =====================================================================
   암기 노트
   ===================================================================== */
let sheetOn = false, noteTopic = null;
function noteLine(l) {
  let tag = '', lvTag = '';
  const lm = l.match(/^\^([23])\s*/);
  if (lm) { lvTag = `<span class="mini lvm${lm[1]}">${LV[lm[1]]}</span>`; l = l.slice(lm[0].length); }
  const m = l.match(/^\[(.+?)\]\s*/);
  if (m) { tag = m[1] === '필기' ? '<span class="pen-tag">필기</span>' : `<span class="mini">${esc(m[1])}</span>`; l = l.slice(m[0].length); }
  const body = esc(l).replace(/\{\{(.+?)\}\}/g, (_, k) => `<span class="key" tabindex="0">${k.split('|')[0]}</span>`);
  return `<li>${lvTag}${tag}${body}</li>`;
}
function renderNotes() {
  if (!noteTopic) noteTopic = S.set.topics[0] || TOPICS[0].id;
  const T = TOPICS.find(t => t.id === noteTopic);
  const is11 = noteTopic === 't11';
  const secs = is11 ? NOTES.map(n => [n.h, n.lines, n.star]) : TD[noteTopic].notes.map(([h, ls]) => [h, ls, false]);
  const pairs = is11 ? PAIRS : (TD[noteTopic].pairs || []);
  view.innerHTML = `
    <div class="notes-head">
      <h2>암기 노트</h2>
      <button class="btn sheet-btn" id="sheet" aria-pressed="${sheetOn}">${sheetOn ? '빨간 시트 걷기' : '빨간 시트 덮기'}</button>
    </div>
    <div class="tpick">${TOPICS.map(t => `<button class="tp" data-t="${t.id}" aria-pressed="${t.id === noteTopic}">${t.no}</button>`).join('')}</div>
    <h3 class="ntitle">주제 ${T.no}. ${esc(T.title)}<span>${esc(T.pages)}</span></h3>
    <p class="hint">빨간 글씨가 외울 내용이에요. 시트를 덮으면 가려지고, 가려진 칸을 누르면 그 칸만 보여요.</p>
    <div class="notes ${sheetOn ? 'sheet-on' : ''}" id="notes">
      ${secs.map(([h, ls, star]) => `<section class="nsec"><h3>${esc(h)}${star ? ' <span class="star" title="필기 별표">★</span>' : ''}</h3><ul>${ls.map(noteLine).join('')}</ul></section>`).join('')}
      ${is11 ? `<section class="nsec"><h3>연표</h3><table class="tl-tbl">${TIMELINE.map(([y, e, s]) => `<tr><th><span class="key" tabindex="0">${y}</span></th><td>${esc(e)} <span class="mini">${esc(SRC[s])}</span></td></tr>`).join('')}</table></section>` : ''}
      ${pairs.length ? `<section class="nsec"><h3>헷갈리는 쌍</h3><div class="pairs">${pairs.map(p => `<div class="pair"><div><b>${esc(p[0])}</b><span class="key" tabindex="0">${esc(p[1])}</span></div><div><b>${esc(p[2])}</b><span class="key" tabindex="0">${esc(p[3])}</span></div></div>`).join('')}</div></section>` : ''}
      <div class="redsheet" aria-hidden="true"></div>
    </div>
    <div class="btnrow"><button class="btn primary" id="quiz1">이 주제만 문제 풀기</button></div>`;
  $('#sheet').onclick = () => { sheetOn = !sheetOn; $('#notes').classList.toggle('sheet-on', sheetOn); $('#sheet').setAttribute('aria-pressed', sheetOn); $('#sheet').textContent = sheetOn ? '빨간 시트 걷기' : '빨간 시트 덮기'; $$('.key.peek').forEach(k => k.classList.remove('peek')); };
  $$('.key', view).forEach(k => { const t = () => sheetOn && k.classList.toggle('peek'); k.onclick = t; k.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } }; });
  $$('.tp', view).forEach(b => b.onclick = () => { noteTopic = b.dataset.t; renderNotes(); window.scrollTo(0, 0); });
  $('#quiz1').onclick = () => { S.set.topics = [noteTopic]; save(); go('home'); };
}

/* =====================================================================
   오답 노트
   ===================================================================== */
function renderWrong() {
  const ids = Object.keys(S.wrong).filter(byId).sort((a, b) => S.wrong[b] - S.wrong[a]);
  const ex = ids.filter(id => EXAM_BY[id]), rc = ids.filter(id => !EXAM_BY[id]);
  const li = id => { const b = byId(id); return `<li><div class="wq">${esc(shortQ(id))}</div><div class="wa">정답: ${esc(answerOf(id))}</div><div class="wm"><span class="st lv${b.lv}">${LV[b.lv]}</span><span class="st">${KIND[b.k]}</span><span class="cnt-x">${S.wrong[id]}번 틀림</span></div></li>`; };
  view.innerHTML = `
    <div class="notes-head"><h2>오답 노트</h2></div>
    ${ids.length ? `
      <p class="hint">틀리면 자동으로 모이고, 다시 맞힐 때마다 횟수가 줄어 0이 되면 빠져요.</p>
      <div class="btnrow"><button class="btn primary" id="redo">오답 ${ids.length}개 다시 풀기</button><button class="btn" id="clear">오답 노트 비우기</button></div>
      ${ex.length ? `<h3 class="sec">실전 ${ex.length}</h3><ol class="wlist">${ex.map(li).join('')}</ol>` : ''}
      ${rc.length ? `<h3 class="sec">암기 ${rc.length}</h3><ol class="wlist">${rc.map(li).join('')}</ol>` : ''}`
      : '<div class="empty"><p>아직 틀린 문제가 없어요.</p><p class="hint">문제를 풀다 틀리면 여기에 모여요.</p><button class="btn primary" id="tohome">문제 풀러 가기</button></div>'}`;
  if (ids.length) {
    $('#redo').onclick = () => startPractice(shuffle(ids).map(id => EXAM_BY[id] ? { ...EXAM_BY[id] } : BANK_BY[id]), 'review');
    $('#clear').onclick = e => { if (e.target.dataset.sure) { S.wrong = {}; save(); renderWrong(); } else { e.target.dataset.sure = 1; e.target.textContent = '한 번 더 누르면 비워요'; } };
  } else $('#tohome').onclick = () => go('home');
}

/* ---------- 키보드 ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  const nx = $('#next'); if (e.key === 'Enter' && nx) { e.preventDefault(); nx.click(); return; }
  if (P && P.cur && !P.cur.done && $('#card')) {
    if (P.cur.ox) { if (/^[oO]$/.test(e.key)) answer(0); if (/^[xX]$/.test(e.key)) answer(1); }
    else if (/^[1-5]$/.test(e.key) && P.cur.choice && +e.key <= P.cur.opts.length) answer(+e.key - 1);
  }
});

$$('.nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
go('home');

/* 테스트용 */
window.__hk = { genAutoExams, examSet, pickSpaced, SOURCES, AUTO_BY, KEYPOOL, BANK, EXAM, instantiate, judgeTyped, S, recallPool, examPool };

/* 오프라인용 서비스 워커 (GitHub Pages에서만 동작) */
if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) {
  navigator.serviceWorker.register('./sw.js').catch(() => { });
}
</script>
